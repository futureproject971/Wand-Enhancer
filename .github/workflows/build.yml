name: Build executable

on:
  workflow_dispatch:
    inputs:
      enable_update_notifications:
        description: Include GitHub release checks when Wand starts
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches: [master, 'feature/rc_*', 'wg-rebrand-keyauth']

jobs:
  build:
    runs-on: windows-latest
    env:
      WG_VISION_LOADER_TOKEN: ${{ secrets.VISION_LOADER_TOKEN || secrets.WG_VISION_LOADER_TOKEN }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Validate Vision Auth configuration
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WG_VISION_LOADER_TOKEN)) {
            throw "VISION_LOADER_TOKEN or WG_VISION_LOADER_TOKEN repository secret is missing or empty."
          }
          Write-Host "Vision Auth loader token is present."

      - name: Build unsigned executable
        shell: pwsh
        run: |
          if ('${{ inputs.enable_update_notifications }}' -eq 'true') {
            ./build.ps1 -Configuration Release -EnableUpdateNotifications
          } else {
            ./build.ps1 -Configuration Release
          }

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WGEnhancer-unsigned
          path: WandEnhancer/bin/Release/WGEnhancer.exe
          if-no-files-found: error

      # The published artifact is always the offline build; this only proves the
      # opt-in variant still compiles and passes its checks on every push.
      - name: Verify opt-in update notifications build
        shell: pwsh
        run: ./build.ps1 -Configuration Release -EnableUpdateNotifications
